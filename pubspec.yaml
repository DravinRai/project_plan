name: project_plan
description: A visual clock-based time blocking and habit consistency tracking app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_sign_in_all_platforms: ^1.1.2

  # ── Firebase ─────────────────────────────────────────────
  firebase_core: ^3.10.1
  firebase_auth: ^5.4.1
  cloud_firestore: ^5.6.1
  firebase_messaging: ^15.2.1
  firebase_analytics: ^11.4.1
  firebase_crashlytics: ^4.2.1
  firebase_remote_config: ^5.2.1

  # ── Auth ─────────────────────────────────────────────────
  google_sign_in: ^6.2.2

  # ── State Management ──────────────────────────────────────
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.3.5

  # ── Navigation ────────────────────────────────────────────
  go_router: ^14.3.0

  # ── Local Storage (offline cache) ─────────────────────────
  hive_flutter: ^1.1.0

  # ── Notifications ─────────────────────────────────────────
  flutter_local_notifications: ^18.0.1

  # ── Utilities ─────────────────────────────────────────────
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  uuid: ^4.5.1
  printing: ^5.14.2
  pdf: ^3.11.3
  image_picker: ^1.2.1
  url_launcher: ^6.3.0
  flutter_secure_storage: ^10.0.0
  desktop_webview_auth: ^0.0.16
  http: ^1.2.0
  crypto: ^3.0.3
  flutter_animate: ^4.5.2
  firebase_app_check: ^0.3.2+10

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.12
  riverpod_generator: ^2.4.3
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  windows:
    generate: true
    image_path: "assets/images/app_icon.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
  image_path: "assets/images/app_icon.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
